name: Verify and deploy benchmark
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: benchmark-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read pinned RoboBuddy runtime
        uses: actions/checkout@v4
        with:
          repository: jivishov/RoboBuddy_IDE
          ref: e87940e17271daff0390f6d38cbd4a27ddf18b48
          path: .upstream/ide
          persist-credentials: false
      - name: Read pinned Lab Studio contracts
        uses: actions/checkout@v4
        with:
          repository: jivishov/Lab-Studio_WebMCP
          ref: e66472f898a6a5fb12d85f3f1d1f64ad10e48259
          path: .upstream/lab
          persist-credentials: false
      - name: Unit tests and static build
        run: |
          npm test
          npm run build
      - name: Install browser-test dependencies
        run: |
          npm install --ignore-scripts
          npx playwright install --with-deps chromium
      - name: Browser and actual runtime smoke checks
        run: npm run test:browser
      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-verification
          path: test-results/
          retention-days: 14
      - name: Preserve built site for independent inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-built-site
          path: dist/
          retention-days: 7
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
